name: MLOPs Pipleline

on:
    push:
        branches: [cicd]

env:
    AWS_REGION: ap-south-1
    S3_BUCKET: churn-model-bucket-cicd-ajith

jobs: 
    train-and-deploy:
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v4
              with: 
                python-version: '3.13.4'
                     
        
            - name: Install dependencies
              run: |
                pip install -r requirements.txt

            - name: Generate dataset
              run: python generate_data.py

            - name: Train model
              run: python train.py

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Upload model to S3
              run: |
                aws s3 cp churn_model.pkl s3://churn-model-bucket-cicd-ajith/models/churn_model.pkl
                sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" k8s/inference.yaml

            - name: Commit updated inference.yaml
              run: |
                git config --local user.name "actions@github.com"
                git config --local user.email "GitHub Actions"
                git add k8s/inference.yaml
                git commit -m "Update model S3 path [skip ci]" || echo "No changes"
                git push || echo "No changes to push" 
        